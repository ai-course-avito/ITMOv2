[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["omnixon"]

[project]
name = "omnixon-lib"
version = "4.2.0"
authors = [
  { name="lixelv", email="simeongfremenko@gmail.com" },
]
description = "A small enterprise chatbot library"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "httpx",
    "pydantic>=2",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio"]  # the default group of uv

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]  # test the source, whatever is installed

[project.urls]
Homepage = "https://github.com/lixelv/pypi-package-template"
Issues = "https://github.com/lixelv/pypi-package-template"
