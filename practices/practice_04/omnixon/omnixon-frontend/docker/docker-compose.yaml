# Example: the panel in front of a Omnixon service running on the host.
# For a service in another compose project, join its network and use its service name.
services:
  admin-panel:
    build:
      context: ..
      dockerfile: docker/Dockerfile.panel
    ports:
      - "8080:80"
    environment:
      OMNIXON_URL: ${OMNIXON_URL:-http://host.docker.internal:8083}
    extra_hosts:
      - "host.docker.internal:host-gateway"
