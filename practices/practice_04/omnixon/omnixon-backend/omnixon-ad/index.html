// hops and falls away tumbling. A marked word is a solid block: its fill springs in behind the letters

  const pulled = PLUCK.filter(p => t >= p.t).map(p => p.i);
  const items = MCP52.map((n, i) => ({ n, i, p: ringPos(i, t) })).sort((a, b) => b.p.z - a.p.z);
  let logoDrawn = false;
  if (t < LOGO_BO) for (const it of items) {
    if (!logoDrawn && it.p.z < 0) { builtinLogo(t); logoDrawn = true; }
    if (pulled.includes(it.i)) continue;
    const pk = PLUCK.find(p => p.i === it.i), hl = pk ? E(t, pk.t - 0.3, pk.t - 0.05) : 0;
    const appear = clamp(spring(t, BURST0 + 0.05 + (it.i % 18) * 0.012, 2.0, 0.55), 0, 1.25);
    const front = clamp((-it.p.z / RING_R - 0.25) / 0.5);
    const depthA = clamp(0.25 + (1 - (it.p.z + RING_R) / (2 * RING_R)) * 0.9, 0.2, 1);
    withAlpha(Math.max(depthA, hl), () => toolChip(it.n, it.p.x, it.p.y, it.p.s * appear * (1 + hl * 0.3), front, hl ? { bg: SC.builtin, fg: COL.fg } : {}));
  }
  if (!logoDrawn && t < LOGO_BO) builtinLogo(t);
  // the plucked calls fly out of the ring into the log, land, and on exit drop away
  PLUCK.forEach((p, k) => {
    if (t < p.t) return;
    const f = spring(t, p.t, 1.4, 0.6), from = ringPos(p.i, p.t), fo = fall(t, OUT_T + 0.08 * k);
    const x = lerp(from.x, p.slot.x, f), y = lerp(from.y, p.slot.y, f) + fo.y;
    if (y > H + 100) return;
    about(x + 120, y, { rot: fo.rot * 0.3 }, () => {
      setFont(21, 700, MONO, 0);
      const nw = ctx.measureText(p.name).width; setFont(21, 500, MONO, 0); const aw = ctx.measureText(p.args).width;
      const da = E(t, p.t + 0.4, p.t + 0.7), land = clamp(spring(t, p.t + 0.45, 2.6, 0.45), 0, 1.3);
      const w = 64 + nw + (aw + 90) * da;
      rr(x - 20, y - 26, w, 52, 26); ctx.fillStyle = f < 0.95 ? SC.builtin : COL.card; ctx.fill(); ctx.strokeStyle = COL.line; ctx.lineWidth = 1.5; ctx.stroke();
      disc(x + 4, y, 6, SC.builtin);
      setFont(21, 700, MONO, 0); ctx.fillStyle = COL.fg; ctx.fillText(p.name, x + 22, y + 7);
      withAlpha(da, () => { setFont(21, 500, MONO, 0); ctx.fillStyle = COL.mute; ctx.fillText(p.args, x + 22 + nw, y + 7); });
      if (land > 0) about(x + 22 + nw + aw + 50, y, { sx: land, sy: land }, () => chip(x + 22 + nw + aw + 50, y, p.res, { size: 15, padX: 10, h: 30 }));
    });
  });
  // the prompt rises on a spring; the reply pops; both drop away on exit
  const pr = spring(t, PROMPT_T - 0.35, 1.5, 0.6), fp = fall(t, OUT_T);
  if (pr > 0 && fp.y < H) about(300, 859, { dy: (1 - pr) * 300 + fp.y, rot: fp.rot * 0.2 }, () => {
    setFont(24, 500, MONO, 0); const w = ctx.measureText(T.prompt).width + 52;
    rr(130, 828, w, 62, 31); ctx.fillStyle = COL.card; ctx.fill(); ctx.strokeStyle = COL.fg; ctx.lineWidth = 2; ctx.stroke();
    typed(T.prompt, 154, 867, 24, t, PROMPT_T, 42, { color: COL.fg, cursor: true, cursorUntil: PLUCK[0].t });
  });
  const ra = clamp(spring(t, REPLY_T, 2.0, 0.45), 0, 1.3), fr = fall(t, OUT_T + 0.06, { dir: -1 });
  if (ra > 0 && fr.y < H) about(130, 960, { sx: ra, sy: ra, dy: fr.y, rot: fr.rot * 0.2 }, () => bubble(130, 932, T.reply, { bg: COL.fg, fg: COL.ink, size: 22 }));
  heavy(T.speaks, W / 2, 190, 112, t, B0 + 0.4, { align: 'center', maxW: 1600, g: 9000, h: 560, ringO: T.speaksRing, out: OUT_T, marker: { from: T.speaksMk[0], to: T.speaksMk[1], col: SC.builtin, ink: COL.fg, t: B0 + 1.0 } });
  withAlpha(E(t, B0 + 0.8, B0 + 1.2, 'outCubic') * (1 - E(t, OUT_T, OUT_T + 0.2)), () => {
    setFont(19, 700, MONO, 4); ctx.fillStyle = COL.fg; ctx.textAlign = 'center';
    ctx.fillText(T.toolsN(Math.round(52 * E(t, B0 + 0.8, B0 + 1.8, 'outCubic'))), W / 2, 246); ctx.textAlign = 'left';
  });
}

// =====================================================================================
//  SCENE 9 — OUTRO (67 → 74.4): the mark rises, the features flood out of it, then it comes down for good
// =====================================================================================
const SLAM = S.slam, SD = (SLAM - S.outro) / T.strobe.length;
const STROBE = T.strobe.map((w, i) => ({ w, c: i % 2 ? COL.bg : COL.fg, ink: i % 2 ? COL.fg : COL.ink, t0: S.outro + i * SD }));
const WM = 'Omnixon', WM_SIZE = 196, LOGO_S = 190;
function wordmarkGeom() { mctx.font = `700 ${WM_SIZE}px ${SANS}`; mctx.letterSpacing = `${-0.035 * WM_SIZE}px`; const wW = mctx.measureText(WM).width, gap = 52, gx = W / 2 - (LOGO_S + gap + wW) / 2; return { wW, gx, tx: gx + LOGO_S + gap, lx: gx + LOGO_S / 2 }; }
const STROBE_G = 16000, STROBE_H = 700;
STROBE.forEach((s, i) => { cue(s.t0, 'stutter', { i }); cueHeavy(s.w, s.t0 + 0.02, { stagger: 0.02, g: STROBE_G, h: STROBE_H, n0: i, every: 2, gain: 0.2, thump: 0.35, bump: 4 }); });
cue(SLAM, 'swell', { d: 0.3 }); cue(SLAM + 0.28, 'boom', { g: 1 }); bump(SLAM + 0.28, 16); impact(SLAM + 0.28, 1.2);
cue(SLAM + 0.75, 'swell', { d: 0.5 }); cue(SLAM + 1.2, 'thump', { g: 0.4 });
T.tagline.split(' ').forEach((w, i) => cue(SLAM + 1.6 + i * 0.07 + landT(160, 4500), 'tok', { n: SCALE[i % SCALE.length] + 12, g: 0.18 }));
cueTyping('omnixon.net', SLAM + 2.2, 24, 1, 0.4); cue(SLAM + 2.7, 'chime', { n: 96 });

function outroLogo(t) {
  const up = spring(t, LOGO_BO, 1.4, 0.62), down = spring(t, SLAM, 1.4, 0.5), slide = spring(t, SLAM + 0.75, 1.3, 0.62), g = wordmarkGeom();
  return { x: lerp(W / 2, g.lx, slide), y: lerp(lerp(MC.y, 300, up), 470, down), s: lerp(lerp(160, 110, up), LOGO_S, down) };
}
function sOutro(t) {
  const L = outroLogo(t);
  // the features flood out of the mark, one per half-beat, alternating white and black
  if (t >= S.outro) {
    const i = clamp(Math.floor((t - S.outro) / SD), 0, STROBE.length - 1), st = STROBE[i];
    if (i > 0) flood(STROBE[i - 1].c);
    ctx.beginPath(); ctx.arc(L.x, L.y, 2500 * ease.outExpo(P(t, st.t0, st.t0 + 0.3)), 0, TAU); ctx.fillStyle = st.c; ctx.fill();
    if (t < SLAM + 0.6) {
      heavy(st.w, W / 2, 790, 200, t, st.t0 + 0.02, { align: 'center', maxW: 1500, stagger: 0.02, g: STROBE_G, h: STROBE_H, color: st.ink, out: i === STROBE.length - 1 ? SLAM : null });
      withAlpha(E(t, st.t0 + 0.08, st.t0 + 0.2) * (1 - E(t, SLAM, SLAM + 0.15)), () => { setFont(18, 700, MONO, 4); ctx.fillStyle = st.ink; ctx.textAlign = 'center'; ctx.fillText(`0${i + 1} / 0${STROBE.length} · ${T.also}`, W / 2, 470); ctx.textAlign = 'left'; });
    }
  }
  // the mark: lands heavy at the slam, slides aside; a white block runs out of it and uncovers the name
  const g = wordmarkGeom(), cy = 470, wb = wobble(t, SLAM + 0.28, 0.14, 7, 22);
  const grow = spring(t, SLAM + 1.0, 1.8, 0.6), retract = E(t, SLAM + 1.35, SLAM + 1.7, 'inOutExpo');
  if (retract > 0) { ctx.save(); ctx.beginPath(); ctx.rect(g.tx - 10, 0, (g.wW + 30) * retract + 10, H); ctx.clip(); setFont(WM_SIZE, 700, SANS, -0.035 * WM_SIZE); ctx.fillStyle = COL.fg; ctx.fillText(WM, g.tx, cy + WM_SIZE * 0.36); ctx.restore(); }
  if (grow > 0 && retract < 1) { const a = g.tx - 10 + (g.wW + 30) * retract, b = g.tx - 10 + (g.wW + 30) * grow; ctx.fillStyle = COL.fg; ctx.fillRect(a, cy - WM_SIZE * 0.42, Math.max(0, b - a), WM_SIZE * 0.84); }
  about(L.x, L.y, { sx: 1 + wb * 0.7, sy: 1 - wb }, () => logo(L.x, L.y, L.s));
  // the promise drops in word by word; the link types itself
  const tag = T.tagline.split(' ');
  setFont(42, 600, SANS, -0.4);
  const tw = ctx.measureText(tag.join(' ')).width; let x = W / 2 - tw / 2;
  tag.forEach((w, i) => {
    const d = drop(t, SLAM + 1.6 + i * 0.07, 160, { g: 4500 }), ww = ctx.measureText(w).width;
    if (d) about(x + ww / 2, 668, { dy: d.y, sx: d.sx, sy: d.sy }, () => { ctx.fillStyle = i >= T.tagHi ? COL.fg : COL.mute; ctx.fillText(w, x, 668); });
    x += ctx.measureText(w + ' ').width;
  });
  withAlpha(E(t, SLAM + 2.1, SLAM + 2.3), () => {
    typed('omnixon.net', W / 2 - 104, 760, 34, t, SLAM + 2.2, 24, { color: COL.link, weight: 700 });
    setFont(34, 700, MONO, 0); const uw = ctx.measureText('omnixon.net').width;
    ctx.fillStyle = COL.link; ctx.fillRect(W / 2 - 104, 776, uw * clamp(spring(t, SLAM + 2.7, 1.6, 0.7)), 3);
    const ar = spring(t, SLAM + 2.75, 2, 0.5);
    if (ar > 0) { setFont(34, 500, MONO, 0); withAlpha(clamp(ar), () => ctx.fillText('→', W / 2 - 104 + uw + 18 + (1 - ar) * -24, 760)); }
  });
}

// every scene draws only inside its window; the windows overlap so the next scene grows out of the last
const SCENES = [
  { name: 'INTRO', a: S.intro, b: S.ch, from: 0, to: S.ch, fn: sIntro },
  { name: 'CHANNELS', a: S.ch, b: S.code, from: S.ch, to: S.code, fn: sChannels },
  { name: 'SIMPLICITY', a: S.code, b: S.model, from: S.code, to: S.model + 0.3, fn: sCode },
  { name: 'ANY MODEL', a: S.model, b: S.rag, from: MORPH_CM, to: MORPH_MR + 0.9, fn: sModels },
  { name: 'KNOWLEDGE', a: S.rag, b: S.mcp, from: MORPH_MR, to: S.mcp, fn: sRag },
  { name: 'MCP TOOLS', a: S.mcp, b: S.agents, from: S.mcp, to: MCP_OUT + 1.0, fn: sMcp },
  { name: 'AGENTS', a: S.agents, b: S.builtin, from: MORPH_MA, to: AG_OUT + 1.0, fn: sAgents },
  { name: 'BUILT-IN MCP', a: S.builtin, b: S.outro, from: MERGE_AB, to: OUT_T + 0.9, fn: sBuiltin },
  { name: 'OMNIXON', a: S.outro, b: S.end, from: LOGO_BO, to: S.end, fn: sOutro },
];
const DIVE = [S.ch - 0.9, S.ch], ZOOMO = [S.code - 0.5, S.code];

function renderContent(t, target) {
  ctx = target; ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (t >= DIVE[0] && t < DIVE[1]) {
    // the camera dives through the ring; the first channel is already waiting inside it
    sChannels(t); sIntro(t, true);
  } else if (t >= ZOOMO[0] && t < ZOOMO[1]) {
    // the camera flies through the O of ONE API; the code scene is already waiting inside it
    const p = P(t, ZOOMO[0], ZOOMO[1]), o = ringOGeom(), z = 1 + ease.inExpo(p) * 90, k = ease.inOutCubic(p);
    const view = { tx: lerp(o.x, W / 2, k), ty: lerp(o.y, H / 2, k) };
    const sub = (c2d, fn) => { const prev = ctx; ctx = c2d; ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); fn(); ctx.restore(); ctx = prev; };
    sub(bctxB, () => { background(t); const zb = lerp(0.55, 1, ease.outCubic(p)); ctx.translate(W / 2, H / 2); ctx.scale(zb, zb); ctx.translate(-W / 2, -H / 2); sCode(t); });
    sub(bctxA, () => { ctx.fillStyle = COL.bg; ctx.fillRect(0, 0, W, H); ctx.translate(view.tx, view.ty); ctx.scale(z, z); ctx.translate(-o.x, -o.y); background(t); sChannels(t); });
    ctx.drawImage(bufB, 0, 0);
    ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.arc(view.tx, view.ty, o.rIn * z, 0, TAU, true); ctx.clip(); ctx.drawImage(bufA, 0, 0); ctx.restore();
  } else {
    background(t);
    ctx.translate(0, camBump(t));
    for (const sc of SCENES) if (t >= sc.from && t < sc.to) sc.fn(t);
  }
  ctx.restore();
}

// ---------- render: motion blur by sub-frames ----------
function render(t) {
  if (SUB === 1) renderContent(t, fctx);
  else for (let k = 0; k < SUB; k++) {
    renderContent(t + ((k + 0.5) / SUB - 0.5) * (0.6 / FPS), fctx);
    actx.globalAlpha = 1 / (k + 1); actx.drawImage(frameC, 0, 0);
  }
  ctx = mainCtx; ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1;
  ctx.drawImage(SUB === 1 ? frameC : accC, 0, 0);
  ctx.restore();
}

// =====================================================================================
//  PLAYER / RENDER HOOKS
// =====================================================================================
if (RENDER_MODE) document.body.classList.add('render');
const fontsReady = Promise.all([
  ...[400, 500, 600, 700, 800, 900].map(w => document.fonts.load(`${w} 40px 'Inter Tight'`, 'AaЯя')),
  ...[400, 500, 600, 700].map(w => document.fonts.load(`${w} 40px 'JetBrains Mono'`, 'AaЯя')),
]).then(() => document.fonts.ready);
EVENTS.sort((a, b) => a.t - b.t);
window.__film = { W, H, DUR, FPS, BEAT, LANG, slam: S.slam, events: EVENTS, sections: SCENES.map(({ name, a, b }) => ({ name, a, b })), render, ready: fontsReady.then(() => true) };

if (!RENDER_MODE) {
  const audio = document.getElementById('music'), btn = document.getElementById('play'), icon = document.getElementById('icon');
  audio.src = `out/music-${LANG}.wav`;
  const scrub = document.getElementById('scrub'), tc = document.getElementById('tc');
  let playing = false, t0 = 0, start = 0, hasAudio = false;
  audio.addEventListener('canplaythrough', () => (hasAudio = true));
  audio.addEventListener('error', () => (hasAudio = false));
  const now = () => (playing ? (hasAudio ? audio.currentTime : t0 + (performance.now() - start) / 1000) : t0);
  const setIcon = () => icon.setAttribute('d', playing ? 'M3 1.5h3v11H3zM8 1.5h3v11H8z' : 'M3 1.5v11l9-5.5z');
  function toggle() {
    if (playing) { t0 = now(); playing = false; audio.pause(); }
    else { if (t0 >= DUR - 0.01) t0 = 0; playing = true; start = performance.now(); audio.currentTime = t0; audio.play().catch(() => (hasAudio = false)); }
    setIcon();
  }
  btn.onclick = toggle; main.onclick = toggle;
  addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); toggle(); } });
  scrub.oninput = () => { t0 = +scrub.value; start = performance.now(); audio.currentTime = t0; };
  fontsReady.then(() => {
    const loop = () => {
      let t = now();
      if (t >= DUR) { t = DUR - 1e-3; if (playing) { playing = false; audio.pause(); t0 = t; setIcon(); } }
      render(t); scrub.value = t; tc.textContent = `${t.toFixed(2).padStart(5, '0')} / ${DUR.toFixed(2)}`;
      requestAnimationFrame(loop);
    };
    loop();
  });
}
