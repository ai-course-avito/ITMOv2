[project]
name = "omnixon-api"
version = "0.1.0"
description = "Omnixon: one API for LLM requests with history, memory, RAG and tools"
requires-python = ">=3.11"

# Direct dependencies only; uv.lock pins everything else.
dependencies = [
    "fastapi==0.128.7",
    "uvicorn[standard]==0.42.0",
    "asyncpg==0.30.0",
    "pgvector==0.4.2",
    "pydantic==2.12.5",
    "pydantic-ai-slim[openai,mcp]==2.54.0",
    "logfire==4.22.0",
    "opentelemetry-sdk==1.39.1",
    "httpx[socks]==0.28.1", # socks: OPENROUTER_PROXY=socks5://...
    "prometheus-client==0.22.1",
    "redis==8.1.0",
]

[dependency-groups]
test = [
    "fakeredis==2.39.0",
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "pytest-order==1.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["app"]  # the tests import the application; the helpers they share are in app/tests/shared.py
testpaths = ["app/tests"]

[tool.uv]
package = false  # an application, not an installable package
