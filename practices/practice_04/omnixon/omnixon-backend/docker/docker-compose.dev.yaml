name: ${APP_NAME:-PWD##*/}

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: dev-${APP_NAME:-PWD##*/}-api
    command: ["uvicorn", "--app-dir", "app", "main:app", "--host", "0.0.0.0", "--port", "80", "--reload"]
    env_file: ../.env
    environment:
      - POSTGRES_HOST=${POSTGRES_HOST:-db}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${UPSTREAM_PORT:-8000}:80"
    restart: unless-stopped
    tty: true
    volumes:
      - dev-app:/app

  dev:
    build:
        context: ..
        dockerfile: docker/Dockerfile.env
    container_name: dev-${APP_NAME:-PWD##*/}-dev
    volumes:
        - dev-app:/app
    tty: true
    stdin_open: true

  db:
    image: pgvector/pgvector:pg16
    container_name: dev-${APP_NAME:-PWD##*/}-postgres-db
    env_file: ../.env
    environment:
        - POSTGRES_USER=${POSTGRES_USER}
        - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
        - POSTGRES_DB=${POSTGRES_DB}
        - PGDATA=/data/postgres
    ports:
        - "${POSTGRES_PORT:-5432}:5432"
    volumes:
        - postgres-data:/data/postgres
    healthcheck:
        test:
            [
                "CMD-SHELL",
                "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
            ]
        interval: 5s
        timeout: 10s
        retries: 5

    restart: unless-stopped
    tty: true

volumes:
  dev-app:
    name: dev-${APP_NAME:-PWD##*/}-app
  postgres-data:
    name: dev-${APP_NAME:-PWD##*/}-postgres-data