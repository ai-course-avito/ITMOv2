schema: spec-driven

context: |
  Language: ru
  All artifacts must be written in ru.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Project: review-mini — учебный сервис ревью диффа локальной моделью Ollama.
  Stack: Python 3.10+, только стандартная библиотека, тесты на unittest.
  Check command: `sh scripts/check.sh` из корня проекта (compileall + unittest).
  Existing contract: docs/requirements.md (подписки, review_diff, коды
  empty_diff, diff_too_large, model_*); style rules: docs/style-guide.md.
  Compatibility: существующие ответы review_diff и поведение subscribe
  сохраняются, если change явно не говорит обратное. В тестах сеть не
  используется: клиент модели подставляется параметром client.

rules:
  design:
    - Объясни взаимодействие диаграммой Mermaid (sequenceDiagram в блоке ```mermaid); текст решений сохраняй рядом с диаграммой.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
